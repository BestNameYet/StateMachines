name: Update repository manifest

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'

permissions:
  contents: write

concurrency:
  group: repository-manifest-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh inventory and README index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # Rebuild from the latest branch on each attempt, preserving concurrent
            # Semantic Operator edits rather than force-pushing stale output.
            git fetch origin main
            git reset --hard origin/main
            python -m unittest discover -s tests -p 'test_repository_manifest.py'
            python scripts/update_repository_manifest.py
            git add -- manifest.json README.md
            if git diff --cached --quiet; then
              echo 'Manifest and README index are current.'
              exit 0
            fi
            git commit -m 'Update repository manifest and README index'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Could not publish inventory after three attempts.' >&2
          exit 1
