name: Run HTMLHiddenVarEditor
# rerun after authoritative output restore

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-html-hidden-var-editor.yml'

permissions:
  contents: write

jobs:
  run-html-hidden-var-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute HTMLHiddenVarEditor through JS Runner
        run: |
          node 'untrusted AI/meta-procedure/Procedures/JS Runner/js-runner.js' \
            'untrusted AI/meta-procedure/Procedures/HTMLHiddenVarEditor/output.json' \
            'untrusted AI/shared-chat-page.html' \
            'untrusted AI/meta-procedure/Procedures/HTMLHiddenVarEditor/shared-chat-page.rebuilt.html'

      - name: Commit rebuilt HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'untrusted AI/meta-procedure/Procedures/HTMLHiddenVarEditor/shared-chat-page.rebuilt.html'
          git commit -m "Rebuild shared chat HTML hidden variables"
          git push origin HEAD:main
