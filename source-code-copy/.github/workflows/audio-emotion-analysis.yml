name: Audio emotion analysis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ChatMachines/AudioEmotionAnalysis/analyze.py'
      - 'ChatMachines/AudioEmotionAnalysis/requirements.txt'
      - 'ChatMachines/AudioEmotionAnalysis/input.mp3.b64'
      - '.github/workflows/audio-emotion-analysis.yml'
permissions:
  contents: write
concurrency:
  group: audio-emotion-analysis
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ChatMachines/AudioEmotionAnalysis/requirements.txt
      - name: Verify transfer and analyze original audio
        run: python ChatMachines/AudioEmotionAnalysis/analyze.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-emotion-${{ github.run_id }}
          path: ChatMachines/AudioEmotionAnalysis/outputs/
          if-no-files-found: warn
      - name: Persist observed result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ChatMachines/AudioEmotionAnalysis/outputs/result.json
          git commit -m 'Record audio emotion analysis result' || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
          done
          exit 1
