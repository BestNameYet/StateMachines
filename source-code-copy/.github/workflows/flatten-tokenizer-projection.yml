name: Flatten minified Agents projection

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/flatten-tokenizer-projection.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Flatten minified projection
        run: node ChatMachines/TokenizerCalibration/flatten-projection.js

      - name: Commit flattened projection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChatMachines/TokenizerCalibration/agents-by-header-flattened.json
          if git diff --cached --quiet; then
            echo "No flattened projection change."
            exit 0
          fi
          git commit -m "Flatten minified Agents projection"
          git pull --rebase origin main
          git push origin HEAD:main
