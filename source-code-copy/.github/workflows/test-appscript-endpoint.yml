name: Test Apps Script endpoint

on:
  push:
    paths:
      - .github/workflows/test-appscript-endpoint.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: POST sourcecode and arguments
        run: |
          curl --location --silent --show-error --fail-with-body --max-time 60 \
            --header 'Content-Type: application/json' \
            --data '{"sourcecode":"(input) => { const reversed = input.word.split(\"\").reverse().join(\"\"); const values = input.numbers.map(n => n * n + 7); return {ok:true, runtime:\"Apps Script eval\", reversed, values, checksum: values.reduce((a,b)=>a+b,0)}; }","arguments":{"word":"card-deck-test","numbers":[3,8,13,21]}}' \
            --output response.json \
            'https://script.google.com/macros/s/AKfycbxz7tkba4wl-wWzDn90iuh0us2l2EUD3AYV9HyVJckETKGjhPKFthnqPyYmcOPOk_g5FA/exec'
          cat response.json
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("response.json","utf8")); if(r.ok!==true||r.reversed!=="tset-kced-drac"||r.checksum!==711) throw new Error("Unexpected response: "+JSON.stringify(r)); console.log("\\nPASS: arbitrary JavaScript executed remotely and returned the expected JSON.");'
