<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selenium interface test</title><style>body{margin:48px auto;padding:0 24px;max-width:640px;font:18px/1.5 system-ui;color:#193b39;background:#f7f5ef}input,button{font:inherit;padding:12px;border:1px solid #aac0b3;border-radius:8px}button{background:#126b60;color:white}label{display:block;margin-bottom:8px}output{display:block;margin-top:24px;font-weight:700}</style></head><body><h1>Selenium interface test</h1><label for="name">Name</label><input id="name" autocomplete="off"><button id="greet">Say hello</button><output id="greeting" aria-live="polite">Waiting for input.</output><script>document.getElementById('greet').addEventListener('click',()=>{document.getElementById('greeting').textContent='Hello, '+document.getElementById('name').value+'!';});</script></body></html>
