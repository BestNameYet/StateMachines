<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AGENTS Procedure</title>
<style>
:root{font-family:system-ui,sans-serif;color:#1c2533;background:#f3f5f8}body{margin:0}header{background:#172b45;color:white;padding:20px 5vw;display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0}header p{margin:5px 0 0;color:#c4d2e3;font-size:14px}main{max-width:1160px;margin:26px auto;padding:0 20px;display:grid;grid-template-columns:1.2fr 1fr;gap:22px}.card{background:white;border:1px solid #dce2e9;border-radius:12px;padding:24px;min-width:0}h2{font-size:17px;margin:0 0 20px}.field{margin:0 0 20px}.key{font-size:12px;color:#56677b;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}.value{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}pre{font-size:13px;overflow:auto;white-space:pre-wrap}label{display:block;font-weight:650;margin-bottom:7px}textarea,select,input{box-sizing:border-box;width:100%;border:1px solid #a8b6c7;border-radius:6px;padding:10px;font:inherit}textarea{min-height:110px;resize:vertical}textarea.json{font-family:monospace;font-size:13px;min-height:155px}.hint{font-size:12px;color:#5d6c7d;margin-top:5px}button{border:0;border-radius:6px;background:#205fbd;color:white;padding:11px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}header button{background:#314d70}#error{white-space:pre-wrap;color:#a22727;background:#fff0ef;padding:12px;border-radius:6px;margin-bottom:15px}#error:empty{display:none}#status{color:#526174;font-size:13px;margin-bottom:15px}.success{padding:18px;background:#eaf5ee;border-radius:8px}details{margin-top:22px}summary{cursor:pointer;color:#40566d}#new-files{min-height:65px}#progress{font-size:13px;padding:6px 10px;border:1px solid #7286a0;border-radius:20px}@media(max-width:760px){main{grid-template-columns:1fr;padding:0 12px;margin-top:14px}.card{padding:18px}header{padding:16px}header p{max-width:220px}}
</style></head><body>
<header><div><h1>AGENTS Procedure</h1><p>Read the instruction. Enter its return values.</p></div><span id="progress">Starting</span></header>
<main><section class="card"><h2>Current instruction</h2><div id="instruction"></div><form id="menu-form"><label for="menu-command">Menu command</label><input id="menu-command" placeholder="state, back, or retry" required><button type="submit">Run command</button></form></section>
<section class="card"><h2>Return values</h2><div id="status"></div><form id="return-form"><div id="inputs"></div><details id="files-section"><summary>Designate new files</summary><p class="hint">One filename per line. Existing-file checks are skipped only for these filenames or records marked newFile: true.</p><textarea id="new-files" aria-label="New file names"></textarea></details><div id="error" role="alert"></div><button id="submit" type="submit">Submit values</button></form><div id="complete" class="success" hidden>Procedure complete.</div><details><summary>Submitted values</summary><pre id="history"></pre></details></section></main>
<script>
let run;
const $=id=>document.getElementById(id);
async function request(url,data){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw Error(result.error);return result;}
function describe(value){return typeof value==='string'?value:JSON.stringify(value,null,2);}
function paint(next){run=next;$('error').textContent='';$('progress').textContent=run.done?'Complete':'Render '+run.render;$('instruction').replaceChildren();
 for(const [key,value] of run.entries){const block=document.createElement('div');block.className='field';const label=document.createElement('div');label.className='key';label.textContent=key;const content=document.createElement('div');content.className='value';content.textContent=describe(value);block.append(label,content);$('instruction').append(block);}
 $('inputs').replaceChildren();
 for(const field of run.inputs){const block=document.createElement('div');block.className='field';const label=document.createElement('label');label.htmlFor='input-'+field.name;label.textContent='$'+field.name;let input;
 if(field.schema.anyOf?.every(option=>typeof option.const==='string')){input=document.createElement('select');const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='Choose a mode';input.append(placeholder);for(const optionSchema of field.schema.anyOf){const option=document.createElement('option');option.value=JSON.stringify(optionSchema.const);option.textContent=optionSchema.const==='gemini'?'Gemini':'Normal';input.append(option);}}
 else if(field.schema.type==='boolean'){input=document.createElement('select');for(const [v,t] of [['','Choose true or false'],['true','true'],['false','false']]){const option=document.createElement('option');option.value=v;option.textContent=t;input.append(option);}}
 else{input=document.createElement('textarea');if(field.schema.type!=='string'){input.className='json';input.placeholder=field.schema.type==='array'?'[]':field.schema.type==='object'?'{}':'JSON value';}}
 input.id='input-'+field.name;input.name='$'+field.name;input.required=true;input.dataset.variable=field.name;input.dataset.type=field.schema.type||'json';block.append(label,input);const hint=document.createElement('div');hint.className='hint';hint.textContent=field.schema.type==='string'?'Text value':'Valid JSON · '+(field.schema.type||'value');block.append(hint);$('inputs').append(block);}
 $('new-files').value=run.newFiles.join('\n');$('history').textContent=JSON.stringify(run.history,null,2);$('return-form').hidden=run.done;$('complete').hidden=!run.done;$('complete').textContent=run.state.stopReason==='stalled'?'Procedure stopped: three consecutive turns without gap reduction. The objective is incomplete.':'Procedure complete.';$('status').textContent=run.done?'':run.inputs.length?'Enter the requested values. Enter submits; Shift+Enter adds a line.':'This step has no captured return value. Complete its instruction, then continue.';$('submit').textContent=run.inputs.length?'Submit values':'Continue';
 window.currentInstruction=run;
}
$('return-form').addEventListener('submit',async event=>{event.preventDefault();$('submit').disabled=true;try{const values={};for(const input of document.querySelectorAll('[data-variable]'))values['$'+input.dataset.variable]=input.dataset.type==='string'?input.value:JSON.parse(input.value);const newFiles=$('new-files').value.split('\n').map(x=>x.trim()).filter(Boolean);paint(await request('/api/submit',{id:run.id,values,newFiles}));}catch(error){$('error').textContent=error.message;}finally{$('submit').disabled=false;}});
$('return-form').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&event.target.id!=='new-files'){event.preventDefault();$('return-form').requestSubmit();}});
$('menu-form').addEventListener('submit',async event=>{event.preventDefault();try{paint(await request('/api/submit',{id:run.id,command:$('menu-command').value.trim().toLowerCase()}));}catch(error){$('error').textContent=error.message;}});
request('/api/start',{}).then(paint).catch(error=>$('error').textContent=error.message);
</script></body></html>
