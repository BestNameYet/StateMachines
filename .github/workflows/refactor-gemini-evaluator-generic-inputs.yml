name: Refactor Gemini evaluator generic inputs

on:
  push:
    paths:
      - '.github/workflows/refactor-gemini-evaluator-generic-inputs.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add generic inputs and configurable evaluation heuristic
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const root = 'ChatMachines/GeminiEvaluation';
          const configPath = `${root}/config.json`;
          const sourcePath = `${root}/evaluate-supervisor.js`;

          const originalUserRequest = `In commit history create a file that contains a commit by commit record for every commit on GeminiSupervisor or it's predecessor folder and the contents of that folder...track commits until the contents is no longer stored in the dir or it's sub dir. For every commit include the commit number, its description, all files that were effected, how each file was changed, why each change was made, date time. If the commit was part of a wider movement or pattern or goal note that as well, and an evaluation of the success or failure of the commit wrt the user prompt that initiated it, where success is defined as meeting the goal of the user prompt such that the user was satisfied with the commit, and failure is defined as not meeting the goal and/or necessitates additional work to meet goal.`;

          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          config.evaluation_mode = 'generic';
          config.generic_inputs = [
            {
              key: 'git_log',
              type: 'file',
              path: '../GeminiSupervisor/commit history/git-log.txt'
            },
            {
              key: 'commit_history',
              type: 'file',
              path: '../GeminiSupervisor/commit history/commit-history.md'
            },
            {
              key: 'original_user_request',
              type: 'literal',
              value: originalUserRequest
            }
          ];
          config.evaluation_heuristic = [
            'Evaluate the configured commit_history artifact against original_user_request.',
            'For commit coverage, treat git_log as the authoritative commit sequence for the lineage and cutoff represented by that log.',
            'First determine whether every commit represented by git_log that is in scope under the original request is represented exactly once in commit_history, in correct chronological order; report all missing, extra, duplicate, or misordered commits explicitly.',
            'Then evaluate every semantic SUCCESS/FAILURE judgment contained in commit_history. Do not sample. For each recorded commit judgment, determine whether the status and rationale are supported by available evidence and by the original request definition: SUCCESS means the initiating user goal was met such that the user was satisfied with that commit; FAILURE means the goal was not met and/or additional work was necessary to meet it.',
            'Do not infer user satisfaction merely from absence of an immediate corrective commit. When the initiating user prompt or subsequent user feedback is not present in the supplied inputs, mark the semantic judgment INDETERMINATE unless the supplied evidence independently establishes the requested success/failure condition.',
            'Distinguish a commit that is merely an intermediate implementation step from a commit that itself failed its own initiating user request. Additional later work is evidence of FAILURE only when that later work was necessary to satisfy the same initiating user goal.',
            'Also evaluate whether every per-commit field required by original_user_request is present and semantically supported: commit number, description, all affected files, how each file changed, why each change was made, date/time, wider movement/pattern/goal when applicable, and success/failure evaluation relative to the initiating prompt.',
            'Return an exhaustive result. Do not truncate, sample, or collapse individual semantic evaluations.'
          ].join(' ');
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + '\n');

          let source = fs.readFileSync(sourcePath, 'utf8');

          if (!source.includes('function loadGenericInputs()')) {
            const anchor = 'function decodePointerToken(token) {';
            const insertion = `function loadGenericInputs() {\n  const descriptors = Array.isArray(config.generic_inputs) ? config.generic_inputs : [];\n  return descriptors.map((input, index) => {\n    if (!input || typeof input !== 'object') {\n      throw new Error(\`generic_inputs[\${index}] must be an object.\`);\n    }\n    const key = typeof input.key === 'string' && input.key.trim() ? input.key.trim() : \`input_\${index + 1}\`;\n    const type = input.type || 'file';\n    if (type === 'literal') {\n      return { key, type, source: 'config.literal', content: String(input.value ?? '') };\n    }\n    if (type === 'file') {\n      if (typeof input.path !== 'string' || input.path.trim() === '') {\n        throw new Error(\`generic_inputs[\${index}] file input requires path.\`);\n      }\n      const absolutePath = path.resolve(evaluationRoot, input.path);\n      return { key, type, source: absolutePath, content: readText(absolutePath) };\n    }\n    throw new Error(\`Unsupported generic input type: \${type}\`);\n  });\n}\n\nfunction buildGenericEvaluationInstruction(genericInputs) {\n  if (typeof config.evaluation_heuristic !== 'string' || config.evaluation_heuristic.trim() === '') {\n    throw new Error('Generic evaluation requires non-empty config.evaluation_heuristic.');\n  }\n\n  const schema = {\n    response_type: 'generic_evaluation',\n    overall_result: 'PASS | FAIL | PARTIAL | INDETERMINATE',\n    evaluation_heuristic: 'verbatim configured heuristic used',\n    input_inventory: [\n      { key: 'string', source: 'string', role_in_evaluation: 'string' }\n    ],\n    coverage_evaluation: {\n      ground_truth_commit_count: 'integer | null',\n      artifact_commit_count: 'integer | null',\n      missing_commits: [{ sha: 'string', explanation: 'string' }],\n      extra_commits: [{ sha: 'string', explanation: 'string' }],\n      duplicate_commits: [{ sha: 'string', explanation: 'string' }],\n      ordering_errors: [{ sha: 'string', explanation: 'string' }],\n      result: 'PASS | FAIL | PARTIAL | INDETERMINATE',\n      explanation: 'string'\n    },\n    contract_evaluation: [\n      { requirement: 'string', result: 'PASS | FAIL | PARTIAL | INDETERMINATE', evidence: 'string', required_change: 'string | null' }\n    ],\n    semantic_evaluations: [\n      {\n        commit_number: 'integer | null',\n        commit_sha: 'string',\n        recorded_status: 'SUCCESS | FAILURE | other',\n        evaluator_result: 'AGREE | DISAGREE | INDETERMINATE',\n        corrected_status: 'SUCCESS | FAILURE | INDETERMINATE',\n        rationale: 'string',\n        evidence: 'string'\n      }\n    ],\n    semantic_summary: {\n      evaluations_expected: 'integer',\n      evaluations_returned: 'integer',\n      agreements: 'integer',\n      disagreements: 'integer',\n      indeterminate: 'integer'\n    },\n    required_corrections: [\n      { scope: 'string', correction: 'string', reason: 'string' }\n    ]\n  };\n\n  const sections = [\n    'You are an independent generic evaluator. The runtime supplies labeled inputs without assigning semantics to them.',\n    'The evaluation heuristic is supplied by config and is authoritative for how the inputs are interpreted.',\n    'Use only the supplied inputs and the configured heuristic. Do not silently import assumptions from the normal GeminiSupervisor Agents/source evaluation mode.',\n    'Return one JSON object matching this schema:',\n    JSON.stringify(schema, null, 2),\n    'Configured evaluation heuristic:',\n    config.evaluation_heuristic,\n    'Configured inputs:'\n  ];\n\n  for (const input of genericInputs) {\n    sections.push(\`===== INPUT: \${input.key} | source: \${input.source} =====\`, input.content);\n  }\n\n  return sections.join('\\n\\n');\n}\n\n`;
            if (!source.includes(anchor)) throw new Error('Could not find insertion anchor for generic input loader.');
            source = source.replace(anchor, insertion + anchor);
          }

          const oldMainBlock = `  const agents = readText(agentsPath);\n  const program = readText(programPath);\n  const step3Evaluation = readJson(step3EvaluationPath);\n  const messages = appendNextMessage(readJson(messagesPath), readJson(nextPath).nextmessage);\n  const result = await callGemini(messages, buildSystemInstruction(agents, program, step3Evaluation));`;
          const newMainBlock = `  const messages = appendNextMessage(readJson(messagesPath), readJson(nextPath).nextmessage);\n  const useGenericEvaluation = config.evaluation_mode === 'generic';\n  let agents = null;\n  let program = null;\n  let step3Evaluation = null;\n  let genericInputs = [];\n  let systemInstruction;\n\n  if (useGenericEvaluation) {\n    genericInputs = loadGenericInputs();\n    systemInstruction = buildGenericEvaluationInstruction(genericInputs);\n  } else {\n    agents = readText(agentsPath);\n    program = readText(programPath);\n    step3Evaluation = readJson(step3EvaluationPath);\n    systemInstruction = buildSystemInstruction(agents, program, step3Evaluation);\n  }\n\n  const result = await callGemini(messages, systemInstruction);`;

          if (source.includes(oldMainBlock)) {
            source = source.replace(oldMainBlock, newMainBlock);
          } else if (!source.includes("const useGenericEvaluation = config.evaluation_mode === 'generic';")) {
            throw new Error('Could not find main evaluation block to refactor.');
          }

          const oldLog = `    step3_evaluation: step3EvaluationPath,\n    output: evaluationOutputPath,`;
          const newLog = `    evaluation_mode: config.evaluation_mode || 'supervisor',\n    generic_inputs: genericInputs.map(input => ({ key: input.key, source: input.source })),\n    evaluation_heuristic_configured: typeof config.evaluation_heuristic === 'string' && config.evaluation_heuristic.trim() !== '',\n    step3_evaluation: useGenericEvaluation ? null : step3EvaluationPath,\n    output: evaluationOutputPath,`;
          if (source.includes(oldLog)) source = source.replace(oldLog, newLog);

          fs.writeFileSync(sourcePath, source);
          NODE

      - name: Commit generic evaluator refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChatMachines/GeminiEvaluation/config.json ChatMachines/GeminiEvaluation/evaluate-supervisor.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Make evaluator inputs and heuristic config-driven"
            git push origin HEAD:main
          fi
