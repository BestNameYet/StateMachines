name: Tokenizer calibration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tokenizer-calibration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Count representative GeminiSupervisor tokens
        env:
          GEMINI_API_KEY: ${{ vars.GEMINI_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const model = 'gemini-1.5-flash';
          const samples = [
            'ChatMachines/GeminiSupervisor/Agents.md',
            'ChatMachines/GeminiSupervisor/send-to-gemini.js',
            'ChatMachines/GeminiSupervisor/tests/step-3-evaluation.json'
          ];

          async function exactCount(text) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:countTokens`;
            const response = await fetch(url, {
              method: 'POST',
              headers: {
                'x-goog-api-key': process.env.GEMINI_API_KEY,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                contents: [{ parts: [{ text }] }]
              })
            });

            if (!response.ok) {
              throw new Error(`countTokens ${response.status}: ${await response.text()}`);
            }

            const result = await response.json();
            return result.totalTokens;
          }

          const results = [];

          for (const file of samples) {
            const text = fs.readFileSync(file, 'utf8');
            const chars = text.length;
            const exact = await exactCount(text);
            const div3 = Math.ceil(chars / 3);
            const div4 = Math.ceil(chars / 4);

            results.push({
              file,
              characters: chars,
              exact_tokens: exact,
              characters_per_token: Number((chars / exact).toFixed(4)),
              ceil_chars_div_3: div3,
              div_3_error_tokens: div3 - exact,
              div_3_error_percent: Number((((div3 - exact) / exact) * 100).toFixed(2)),
              ceil_chars_div_4: div4,
              div_4_error_tokens: div4 - exact,
              div_4_error_percent: Number((((div4 - exact) / exact) * 100).toFixed(2))
            });
          }

          const totalChars = results.reduce((sum, x) => sum + x.characters, 0);
          const totalExact = results.reduce((sum, x) => sum + x.exact_tokens, 0);
          const totalDiv3 = Math.ceil(totalChars / 3);
          const totalDiv4 = Math.ceil(totalChars / 4);

          const output = {
            model,
            samples: results,
            combined: {
              characters: totalChars,
              exact_tokens: totalExact,
              characters_per_token: Number((totalChars / totalExact).toFixed(4)),
              ceil_chars_div_3: totalDiv3,
              div_3_error_percent: Number((((totalDiv3 - totalExact) / totalExact) * 100).toFixed(2)),
              ceil_chars_div_4: totalDiv4,
              div_4_error_percent: Number((((totalDiv4 - totalExact) / totalExact) * 100).toFixed(2))
            }
          };

          const outputPath = 'ChatMachines/TokenizerCalibration/tokenizer-results.json';
          fs.mkdirSync(path.dirname(outputPath), { recursive: true });
          fs.writeFileSync(outputPath, JSON.stringify(output, null, 2) + '\n');
          console.log(JSON.stringify(output, null, 2));
          NODE

      - name: Commit tokenizer results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChatMachines/TokenizerCalibration/tokenizer-results.json
          if git diff --cached --quiet; then
            echo "No tokenizer result change."
            exit 0
          fi
          git commit -m "Update tokenizer calibration results"
          git push origin HEAD:main
