name: SBE Report Configurable Updates

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Repository-relative path to the update configuration YAML inside the SBE report root
        required: true
        default: ChatMachines/Special Reports/SBE End-to-End Protocol and State Machine Specification/configurable-updates.yml
        type: string

permissions:
  contents: write

concurrency:
  group: sbe-report-configurable-updates-main
  cancel-in-progress: false

jobs:
  apply-configured-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install YAML parser
        run: npm install --no-save --package-lock=false yaml@2

      - name: Execute configured lists
        run: >-
          node
          "ChatMachines/Special Reports/SBE End-to-End Protocol and State Machine Specification/run-configurable-updates.js"
          "${{ inputs.config_path }}"

      - name: Commit report-root changes
        shell: bash
        env:
          REPORT_ROOT: ChatMachines/Special Reports/SBE End-to-End Protocol and State Machine Specification
        run: |
          set -euo pipefail

          if git diff --quiet -- "$REPORT_ROOT" && [ -z "$(git ls-files --others --exclude-standard -- "$REPORT_ROOT")" ]; then
            echo 'Configured functions produced no report-root changes.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REPORT_ROOT"

          if git diff --cached --quiet; then
            echo 'No staged report-root changes.'
            exit 0
          fi

          git commit -m 'Apply configured SBE report updates'
          git push origin HEAD:main
