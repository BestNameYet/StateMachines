name: GitHub command issue
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
  pull-requests: write
concurrency:
  group: github-command-issue-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false
jobs:
  command:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.comment.user.type == 'User' &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.issue.body, '<!-- github-command-surface:v1 -->') &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute owner command
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMAND_API_TOKEN: ${{ secrets.COMMAND_API_TOKEN }}
          COMMAND_OUTPUT_DIR: ${{ runner.temp }}/github-command-result
        run: node 'ChatMachines/Workflow Interactive Procedures/GitHub Command Issue/issue-command.js'
      - name: Save full API response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-command-${{ github.event.comment.id }}
          path: ${{ runner.temp }}/github-command-result/
          if-no-files-found: ignore
          retention-days: 7
