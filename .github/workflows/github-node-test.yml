name: GitHub Node test

on:
  push:
    branches: [main]
    paths:
      - ChatMachines/GitHubNodeTest/run.js

permissions:
  contents: write

jobs:
  run-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run JavaScript on GitHub Node
        run: node ChatMachines/GitHubNodeTest/run.js
      - name: Commit validation result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChatMachines/GitHubNodeTest/result.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Node corpus count validation"
          git push origin HEAD:main
