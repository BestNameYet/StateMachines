name: Cluster consolidated topics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/topic-clustering/**'
      - .github/workflows/cluster-consolidated-topics.yml
permissions:
  contents: read
  actions: read
jobs:
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/topic-clustering/requirements.txt'
      - name: Read source configuration
        id: source
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          c=json.loads(Path('ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/topic-clustering/config.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('run='+str(c['source_run_id'])+'\n')
              out.write('artifact='+c['source_artifact']+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run }}
          name: ${{ steps.source.outputs.artifact }}
          path: source-topics
      - name: Test clustering
        run: python -m unittest discover -s 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/topic-clustering' -p 'test_*.py'
      - name: Cluster all saved topic vectors
        run: python 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/topic-clustering/cluster.py' --config 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/topic-clustering/config.json' --input source-topics --output clustered-topics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hierarchical-topic-groups
          path: clustered-topics/
          retention-days: 30
          if-no-files-found: warn
