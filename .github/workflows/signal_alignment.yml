name: Matching Image Comparison

on:
  push:
    paths:
      - 'matching/trigger.json'

permissions:
  contents: write
  packages: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON trigger
        id: check
        shell: bash
        run: |
          set -euo pipefail
          jq -e 'type == "object" and (keys | sort) == (["run", "timestamp"] | sort) and (.run | type == "boolean") and (.timestamp | type == "string")' matching/trigger.json > /dev/null
          echo "enabled=$(jq -r '.run' matching/trigger.json)" >> "$GITHUB_OUTPUT"

  compare:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current image sets and comparison program
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          lfs: false

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare current anchor against telemetry batch using prebuilt runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount "type=bind,src=${{ github.workspace }},dst=/repo" \
            --workdir /repo \
            --env GITHUB_STEP_SUMMARY=/repo/matching/metrics.md \
            --entrypoint /bin/sh \
            ghcr.io/bestnameyet/statemachines-matching-runtime@sha256:42120a7434505e51189977362dcec4467367257cff6d29210dc6a85c5ba6f3ad \
            -ec '
              cp /workspace/matching/models/spatial_detector.onnx matching/models/spatial_detector.onnx
              cp /workspace/matching/models/feature_encoder.onnx matching/models/feature_encoder.onnx
              python matching/state_machine.py
            '

      - name: Publish comparison report in GitHub Actions summary
        if: always()
        shell: bash
        run: |
          if test -s matching/metrics.md; then
            cat matching/metrics.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No comparison report produced. Check execution logs (including missing anchor images)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matching-comparison-report
          path: matching/metrics.md
          if-no-files-found: ignore

  reset_trigger:
    needs: [gate, compare]
    if: always() && needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Reset consumed trigger and timestamp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Only reset the trigger that started this run; never overwrite a newer request.
          original="$(gh api "repos/${GH_REPO}/contents/matching/trigger.json?ref=${GITHUB_SHA}")"
          original_sha="$(jq -r '.sha' <<< "$original")"
          current="$(gh api "repos/${GH_REPO}/contents/matching/trigger.json?ref=main")"
          current_sha="$(jq -r '.sha' <<< "$current")"
          if [ "$original_sha" != "$current_sha" ]; then
            echo "Trigger changed since this run started; leaving newer request untouched."
            exit 0
          fi
          updated="$(jq -n --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{timestamp: $timestamp, run: false}')"
          encoded="$(printf '%s\n' "$updated" | base64 -w0)"
          gh api --method PUT "repos/${GH_REPO}/contents/matching/trigger.json" \
            -f message="Reset consumed matching trigger" \
            -f content="$encoded" \
            -f sha="$current_sha" \
            -f branch=main
