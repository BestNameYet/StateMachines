name: Matching Image Comparison

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write
  packages: read
  pull-requests: write

concurrency:
  group: matching-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  compare:
    if: startsWith(github.event.pull_request.head.ref, 'matching-trigger/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current image sets and comparison program
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          lfs: false

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare current anchor against telemetry batch using prebuilt runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount "type=bind,src=${{ github.workspace }},dst=/repo" \
            --workdir /repo \
            --env GITHUB_STEP_SUMMARY=/repo/matching/metrics.md \
            --entrypoint /bin/sh \
            ghcr.io/bestnameyet/statemachines-matching-runtime@sha256:42120a7434505e51189977362dcec4467367257cff6d29210dc6a85c5ba6f3ad \
            -ec '
              cp /workspace/matching/models/spatial_detector.onnx matching/models/spatial_detector.onnx
              cp /workspace/matching/models/feature_encoder.onnx matching/models/feature_encoder.onnx
              python matching/state_machine.py
            '

      - name: Publish comparison report in GitHub Actions summary
        if: always()
        shell: bash
        run: |
          if test -s matching/metrics.md; then
            cat matching/metrics.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No comparison report produced. Check execution logs (including missing anchor images)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matching-comparison-report
          path: matching/metrics.md
          if-no-files-found: ignore


      - name: Close request and delete temporary branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GH_REPO}/pulls/${PR_NUMBER}" -f state=closed
          current_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/${BRANCH}" --jq '.object.sha')"
          if [ "$current_sha" = "$EXPECTED_SHA" ]; then
            gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${BRANCH}"
          else
            echo "Branch changed after PR opened; preserving it to avoid deleting newer work."
          fi
