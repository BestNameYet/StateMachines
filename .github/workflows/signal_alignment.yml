name: Matching Environment Bootstrap

on:
  push:
    paths:
      - 'matching/bootstrap.py'
      - '.github/workflows/signal_alignment.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout matching scripts without downloading LFS assets
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          lfs: false

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize using prebuilt Python and ONNX runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount "type=bind,src=${{ github.workspace }},dst=/repo" \
            --workdir /repo \
            --entrypoint /bin/sh \
            ghcr.io/bestnameyet/statemachines-matching-runtime@sha256:42120a7434505e51189977362dcec4467367257cff6d29210dc6a85c5ba6f3ad \
            -ec '
              cp /workspace/matching/models/spatial_detector.onnx matching/models/spatial_detector.onnx
              cp /workspace/matching/models/feature_encoder.onnx matching/models/feature_encoder.onnx
              python matching/bootstrap.py
            '
