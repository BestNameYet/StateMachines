name: Conversation TF-IDF NMF
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/tfidf-nmf/**'
      - '.github/workflows/conversation-tfidf-nmf.yml'
permissions:
  contents: read
  actions: write
concurrency:
  group: conversation-tfidf-nmf
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        partition: [0, 1, 2, 3]
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/tfidf-nmf/requirements.txt'
      - name: Test pipeline
        run: python -m unittest discover -s 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/tfidf-nmf' -p 'test_*.py'
      - name: Analyze one quarter of the dataset
        run: python 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/tfidf-nmf/run.py' --config 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/tfidf-nmf/config.json' --partition-index ${{ matrix.partition }} --partition-count 4 --output nmf-results/partition-${{ matrix.partition }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conversation-tfidf-nmf-partition-${{ matrix.partition }}
          path: nmf-results/
          retention-days: 30
          if-no-files-found: warn
  collect:
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: conversation-tfidf-nmf-partition-*
          path: results
          merge-multiple: true
      - name: Verify disjoint complete partition coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths=set()
          count=0
          reports=[]
          for index in range(4):
              folder=Path('results')/('partition-'+str(index))
              report=json.loads((folder/'report.json').read_text())
              sources=json.loads((folder/'sources.json').read_text())
              for source in sources:
                  if source['path'] in paths: raise ValueError('Overlapping partition')
                  paths.add(source['path'])
                  count+=source['conversations']
              reports.append({'partition':index,'files':len(sources),'conversations':report['coverage']['conversations_seen'],'topics':report['topics']})
          assert len(paths)==134 and count==1334, (len(paths),count)
          Path('results/index.json').write_text(json.dumps({'files':len(paths),'conversations':count,'partitions':reports,'note':'Four independently fitted topic models; topic IDs are local to each partition.'},indent=2))
          print(json.dumps(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conversation-tfidf-nmf-collected
          path: results/
          retention-days: 30
