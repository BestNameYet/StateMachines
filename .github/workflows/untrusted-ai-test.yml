name: Retrieve shared ChatGPT page # extract-request
# execution-trigger-current-request

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/untrusted-ai-test.yml'

permissions:
  contents: write

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download shared page exactly as returned
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'untrusted AI'
          URL='https://chatgpt.com/share/6ac30b84-df3c-83e8-8f04-9225059a7a53?ogimg=plain'
          curl --location \
            --user-agent 'Mozilla/5.0' \
            --dump-header 'untrusted AI/shared-chat-headers.txt' \
            --output 'untrusted AI/shared-chat-page.html' \
            --write-out '%{http_code}\n' \
            "$URL" \
            > 'untrusted AI/shared-chat-status.txt'
          wc -c 'untrusted AI/shared-chat-page.html'
          cat 'untrusted AI/shared-chat-status.txt'

      - name: Build compact structural diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'untrusted AI/shared-chat-page.html';
          const html = fs.readFileSync(path, 'utf8');
          const markers = [
            'linear_conversation',
            '__NEXT_DATA__',
            'streamController',
            'reactRouterContext',
            'enqueue(',
            'conversation_id',
            '"mapping"',
            '"messages"',
            'data-message-author-role'
          ];

          function markerInfo(marker) {
            let count = 0;
            let cursor = 0;
            const samples = [];
            while (true) {
              const at = html.indexOf(marker, cursor);
              if (at === -1) break;
              count++;
              if (samples.length < 3) {
                samples.push(html.slice(Math.max(0, at - 1200), Math.min(html.length, at + marker.length + 2400)));
              }
              cursor = at + marker.length;
            }
            return { count, samples };
          }

          const diagnostics = {
            bytes_utf8: Buffer.byteLength(html, 'utf8'),
            characters: html.length,
            prefix: html.slice(0, 16000),
            suffix: html.slice(-16000),
            markers: Object.fromEntries(markers.map(marker => [marker, markerInfo(marker)]))
          };

          fs.writeFileSync(
            'untrusted AI/shared-chat-diagnostics.json',
            JSON.stringify(diagnostics, null, 2) + '\n'
          );
          NODE
          wc -c 'untrusted AI/shared-chat-diagnostics.json'

      - name: Extract shared ChatGPT conversation to JSON
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          node 'untrusted AI/extract-shared-chat.js'
          OUTPUT_JSON="$(sed -n 's/^json_path=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          test -n "$OUTPUT_JSON"
          node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')); console.log(process.argv[1] + ' parses as JSON')" "$OUTPUT_JSON"
          wc -c "$OUTPUT_JSON"

      - name: Commit raw response, diagnostics, and extracted JSON
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_JSON="${{ steps.extract.outputs.json_path }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'untrusted AI/shared-chat-page.html' \
                  'untrusted AI/shared-chat-headers.txt' \
                  'untrusted AI/shared-chat-status.txt' \
                  'untrusted AI/shared-chat-diagnostics.json' \
                  "$OUTPUT_JSON"
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Extract shared ChatGPT conversation into JSON'
          git push
