name: Gemini Supervisor evaluator

on:
  push:
    branches: [main]
    paths:
      - ChatMachines/GeminiSupervisor/evaluator-nextmessage/nextmessage.json

permissions:
  contents: write

concurrency:
  group: gemini-supervisor-evaluator
  cancel-in-progress: false

jobs:
  evaluate-supervisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Evaluate or revise Gemini Supervisor against Agents.md
        env:
          GEMINI_API_KEY: ${{ vars.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node ChatMachines/GeminiSupervisor/evaluate-supervisor.js

      - name: Commit evaluator response
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ChatMachines/GeminiSupervisor/evaluator-messages.json \
            ChatMachines/GeminiSupervisor/program-evaluation.json
          if [ -f ChatMachines/GeminiSupervisor/revised-send-to-gemini.js ]; then
            git add ChatMachines/GeminiSupervisor/revised-send-to-gemini.js
          fi
          if git diff --cached --quiet; then
            echo "No evaluator output change."
            exit 0
          fi
          git commit -m "Update Gemini Supervisor evaluator output"
          git push origin HEAD:main
