name: Matching Component Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - matching/component_test_config.json
      - matching_test.py
      - .github/workflows/matching_component_tests.yml

jobs:
  component_test:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run configured component
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          config_path = Path("matching/component_test_config.json")
          if not config_path.is_file():
              print("No script available: configuration file does not exist.")
              sys.exit(0)

          try:
              config = json.loads(config_path.read_text())
          except (ValueError, OSError) as exc:
              print(f"No script available: configuration unreadable: {exc}")
              sys.exit(0)

          script = config.get("script") if isinstance(config, dict) else None
          if not isinstance(script, str) or not script.strip():
              print("No script available: script path not configured.")
              sys.exit(0)

          path = Path(script)
          if path.is_absolute() or ".." in path.parts or path.suffix != ".py" or not path.is_file():
              print(f"No script available: script path does not resolve to a Python file: {script}")
              sys.exit(0)

          print(f"Running configured component: {script}", flush=True)
          subprocess.run([sys.executable, str(path)], check=True)
          PY
