name: Matching Component Tests

on:
  workflow_dispatch:

jobs:
  component_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run configured component
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          try:
              config = json.loads(pathlib.Path("matching/component_test_config.json").read_text())
              script = config.get("script") if isinstance(config, dict) else None
          except (OSError, ValueError) as exc:
              print(f"No script available: {exc}")
              sys.exit(0)

          if not isinstance(script, str) or not script.strip():
              print("No script available")
              sys.exit(0)
          path = pathlib.Path(script)
          if path.is_absolute() or ".." in path.parts or path.suffix != ".py" or not path.is_file():
              print(f"No script available: {script}")
              sys.exit(0)
          print(f"Running configured component: {script}", flush=True)
          subprocess.run([sys.executable, str(path)], check=True)
          PY
