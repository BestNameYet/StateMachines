name: Extract conversation keys with JavaScript
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/extract-conversation-keys-js.yml
      - 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/key-extraction/extract-keys.mjs'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Stop superseded Gemini iterator
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {owner: context.repo.owner, repo: context.repo.repo, per_page:100});
            for (const run of runs.filter(r => r.name === 'Conversation Gemini Iterator' && ['queued','in_progress','waiting'].includes(r.status))) {
              await github.rest.actions.cancelWorkflowRun({...context.repo, run_id:run.id});
              core.info('Cancelled superseded Gemini iterator '+run.id);
            }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test key extraction
        run: node 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/key-extraction/extract-keys.mjs' --test
      - name: Extract keys from all bins
        run: node 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/key-extraction/extract-keys.mjs'
      - uses: actions/upload-artifact@v4
        with:
          name: conversation-key-inventory-js
          path: 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/key-extraction/outputs/'
          retention-days: 30
      - name: Save inventory in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/key-extraction/outputs/'
          git commit -m 'Save JavaScript key inventory for all conversation bins'
          git push origin HEAD:main
