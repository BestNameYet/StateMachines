name: Persist Matching Python Dependencies

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/persist_matching_dependencies.yml'

permissions:
  contents: write

concurrency:
  group: matching-wheel-persistence
  cancel-in-progress: false

jobs:
  persist-wheels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Prepare existing wheel directory
        run: |
          set -euo pipefail
          git lfs install --local
          mkdir -p matching/wheels
          find matching/wheels -maxdepth 1 -type f -name '*.whl' -delete
      - name: Download complete binary dependency closure
        run: |
          set -euo pipefail
          python -m pip download --only-binary=:all: --dest matching/wheels -r matching/requirements.txt
      - name: Write wheel inventory with SHA256 checksums
        run: |
          python - <<'PY'
          import hashlib, json, platform, sys
          from pathlib import Path
          root = Path('matching/wheels')
          wheels = sorted(root.glob('*.whl'))
          if not wheels:
              raise SystemExit('No wheels downloaded')
          inventory = {
              'python': platform.python_version(),
              'platform': platform.platform(),
              'architecture': platform.machine(),
              'wheels': [
                  {'filename': p.name, 'size_bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
                  for p in wheels
              ],
          }
          (root / 'manifest.json').write_text(json.dumps(inventory, indent=2) + '\n')
          print(json.dumps(inventory, indent=2))
          PY
      - name: Verify offline installation from stored wheels
        run: |
          set -euo pipefail
          python -m venv /tmp/matching-wheel-verification
          /tmp/matching-wheel-verification/bin/python -m pip install --no-index --find-links=matching/wheels -r matching/requirements.txt
          /tmp/matching-wheel-verification/bin/python -c "import onnxruntime, numpy, PIL; print('Offline dependency import verification passed')"
      - name: Commit and push wheels via Git LFS
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- matching/wheels
          if ! git diff --cached --quiet; then
            git commit -m 'Persist matching Python dependency wheels via Git LFS'
            git push origin HEAD:main
          fi
