name: Comprehension Task Controller

on:
  push:
    branches: [main]
    paths:
      - ChatMachines/GeminiSupervisor/live-ground-truth/read-request.json
      - ChatMachines/GeminiSupervisor/live-ground-truth/reading-room/task_semantic_define_each_array_item-*.json

permissions:
  contents: write

concurrency:
  group: comprehension-task-controller
  cancel-in-progress: false

jobs:
  comprehension-task:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine operation
        id: operation
        shell: bash
        run: |
          set -euo pipefail

          BEFORE='${{ github.event.before }}'
          SHA='${{ github.sha }}'

          if [ "$BEFORE" = '0000000000000000000000000000000000000000' ]; then
            CHANGED=$(git diff-tree --no-commit-id --name-only -r "$SHA")
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$SHA")
          fi

          REQUEST='ChatMachines/GeminiSupervisor/live-ground-truth/read-request.json'
          ROOM='ChatMachines/GeminiSupervisor/live-ground-truth/reading-room'
          TASK='task_semantic_define_each_array_item'
          CHANGE_COUNT=$(printf '%s\n' "$CHANGED" | sed '/^$/d' | wc -l | tr -d ' ')

          REQUEST_CHANGED=false
          if printf '%s\n' "$CHANGED" | grep -qx "$REQUEST"; then
            REQUEST_CHANGED=true
          fi

          if printf '%s\n' "$CHANGED" | grep -Eq "^${ROOM}/${TASK}-[0-9a-fA-F]{40}-(PASS|FAILED)\\.json$"; then
            echo 'PASS and FAILED task-result files are system-owned and may not be modified by a task executor commit.' >&2
            exit 1
          fi

          mapfile -t ACTIVE_TASKS < <(printf '%s\n' "$CHANGED" | grep -E "^${ROOM}/${TASK}-[0-9a-fA-F]{40}\\.json$" || true)

          if [ "$REQUEST_CHANGED" = true ]; then
            if [ "$CHANGE_COUNT" -ne 1 ]; then
              echo 'A comprehension-task request commit may change only read-request.json.' >&2
              exit 1
            fi
            echo 'mode=issue' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${#ACTIVE_TASKS[@]}" -eq 1 ]; then
            TASK_INSTANCE="${ACTIVE_TASKS[0]}"
            echo 'mode=verify' >> "$GITHUB_OUTPUT"
            echo "task_instance=$TASK_INSTANCE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Expected one comprehension task instance submission; found ${#ACTIVE_TASKS[@]}." >&2
          exit 1

      - name: Instantiate comprehension task
        if: steps.operation.outputs.mode == 'issue'
        run: node ChatMachines/ComprehensionTasks/scripts/comprehension-task-reading-room.js issue '${{ github.sha }}'

      - name: Evaluate completed comprehension task
        if: steps.operation.outputs.mode == 'verify'
        id: evaluate
        shell: bash
        run: |
          set +e
          node ChatMachines/ComprehensionTasks/scripts/comprehension-task-reading-room.js verify '${{ steps.operation.outputs.task_instance }}' '${{ github.sha }}'
          CODE=$?
          set -e

          if [ "$CODE" -eq 0 ]; then
            echo 'result=PASS' >> "$GITHUB_OUTPUT"
          elif [ "$CODE" -eq 2 ]; then
            echo 'result=FAILED' >> "$GITHUB_OUTPUT"
          else
            exit "$CODE"
          fi

      - name: Commit comprehension-task state
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ChatMachines/GeminiSupervisor/live-ground-truth/reading-room'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$ROOT"

          if git diff --cached --quiet; then
            echo 'No comprehension-task state changes to commit.'
            exit 0
          fi

          if [ '${{ steps.operation.outputs.mode }}' = 'issue' ]; then
            git commit -m 'Instantiate comprehension task for ${{ github.sha }}'
          elif [ '${{ steps.evaluate.outputs.result }}' = 'PASS' ]; then
            git commit -m 'PASS comprehension task ${{ github.sha }}'
          else
            git commit -m 'FAILED comprehension task ${{ github.sha }}'
          fi

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done

          echo 'Unable to push comprehension-task state after rebasing.' >&2
          exit 1
