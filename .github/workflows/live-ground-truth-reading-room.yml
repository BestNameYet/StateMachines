name: Live Ground Truth Reading Room

on:
  push:
    branches: [main]
    paths:
      - ChatMachines/GeminiSupervisor/live-ground-truth/read-request.json
      - ChatMachines/GeminiSupervisor/live-ground-truth/eval-trigger.json
      - ChatMachines/GeminiSupervisor/live-ground-truth/reading-room/Agents.reader.json-*

permissions:
  contents: write

concurrency:
  group: live-ground-truth-reading-room
  cancel-in-progress: false

jobs:
  reading-room:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PNG renderer
        run: npm install --no-save --no-package-lock sharp

      - name: Determine operation
        id: operation
        shell: bash
        run: |
          set -euo pipefail

          BEFORE='${{ github.event.before }}'
          SHA='${{ github.sha }}'

          if [ "$BEFORE" = '0000000000000000000000000000000000000000' ]; then
            CHANGED=$(git diff-tree --no-commit-id --name-only -r "$SHA")
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$SHA")
          fi

          REQUEST='ChatMachines/GeminiSupervisor/live-ground-truth/read-request.json'
          EVAL_TRIGGER='ChatMachines/GeminiSupervisor/live-ground-truth/eval-trigger.json'
          ROOM='ChatMachines/GeminiSupervisor/live-ground-truth/reading-room'
          CHANGE_COUNT=$(printf '%s\n' "$CHANGED" | sed '/^$/d' | wc -l | tr -d ' ')

          REQUEST_CHANGED=false
          if printf '%s\n' "$CHANGED" | grep -qx "$REQUEST"; then
            REQUEST_CHANGED=true
          fi

          EVAL_TRIGGER_CHANGED=false
          if printf '%s\n' "$CHANGED" | grep -qx "$EVAL_TRIGGER"; then
            EVAL_TRIGGER_CHANGED=true
          fi

          if printf '%s\n' "$CHANGED" | grep -Eq "^${ROOM}/[0-9a-f]{32}\.png$"; then
            echo 'Reading-room PNG cards are system-owned and may not be modified by a reader commit.' >&2
            exit 1
          fi

          if printf '%s\n' "$CHANGED" | grep -qx "$ROOM/Agents.reader.json"; then
            echo 'Agents.reader.json is system-owned and may not be modified by a reader commit.' >&2
            exit 1
          fi

          if printf '%s\n' "$CHANGED" | grep -Eq "^${ROOM}/Agents\.reader\.json-[0-9a-fA-F]{40}-(PASS|FAILED)$"; then
            echo 'PASS and FAILED result files are system-owned and may not be modified by a reader commit.' >&2
            exit 1
          fi

          mapfile -t CHALLENGES < <(printf '%s\n' "$CHANGED" | grep -E "^${ROOM}/Agents\.reader\.json-[0-9a-fA-F]{40}$" || true)

          if [ "$REQUEST_CHANGED" = true ]; then
            if [ "$CHANGE_COUNT" -ne 1 ]; then
              echo 'A read-request commit may change only read-request.json.' >&2
              exit 1
            fi
            echo 'mode=issue' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVAL_TRIGGER_CHANGED" = true ]; then
            if [ "$CHANGE_COUNT" -ne 1 ]; then
              echo 'An evaluation-trigger commit may change only eval-trigger.json.' >&2
              exit 1
            fi
            mapfile -t ACTIVE < <(find "$ROOM" -maxdepth 1 -type f -printf '%p\n' | grep -E "/Agents\.reader\.json-[0-9a-fA-F]{40}$" || true)
            if [ "${#ACTIVE[@]}" -ne 1 ]; then
              echo "Expected exactly one active challenge for explicit verification; found ${#ACTIVE[@]}." >&2
              exit 1
            fi
            CHALLENGE="${ACTIVE[0]}"
            NAME="${CHALLENGE##*/}"
            CHALLENGE_SHA="${NAME#Agents.reader.json-}"
            echo 'mode=verify' >> "$GITHUB_OUTPUT"
            echo "challenge=$CHALLENGE" >> "$GITHUB_OUTPUT"
            echo "challenge_sha=$CHALLENGE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${#CHALLENGES[@]}" -eq 1 ]; then
            if [ "$CHANGE_COUNT" -ne 1 ]; then
              echo 'A challenge submission commit may change only the active challenge JSON.' >&2
              exit 1
            fi
            CHALLENGE="${CHALLENGES[0]}"
            NAME="${CHALLENGE##*/}"
            CHALLENGE_SHA="${NAME#Agents.reader.json-}"
            echo 'mode=verify' >> "$GITHUB_OUTPUT"
            echo "challenge=$CHALLENGE" >> "$GITHUB_OUTPUT"
            echo "challenge_sha=$CHALLENGE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Expected exactly one repaired challenge; found ${#CHALLENGES[@]}." >&2
          exit 1

      - name: Restore challenge manifest
        if: steps.operation.outputs.mode == 'verify'
        uses: actions/cache/restore@v4
        with:
          path: .live-ground-truth-cache/${{ steps.operation.outputs.challenge_sha }}.json
          key: live-ground-truth-reading-room-${{ steps.operation.outputs.challenge_sha }}
          fail-on-cache-miss: true

      - name: Issue fresh reading challenge
        if: steps.operation.outputs.mode == 'issue'
        run: node ChatMachines/GeminiSupervisor/scripts/live-ground-truth-reading-room.js issue '${{ github.sha }}'

      - name: Save issued challenge manifest
        if: steps.operation.outputs.mode == 'issue'
        uses: actions/cache/save@v4
        with:
          path: .live-ground-truth-cache/${{ github.sha }}.json
          key: live-ground-truth-reading-room-${{ github.sha }}

      - name: Evaluate committed reading challenge
        if: steps.operation.outputs.mode == 'verify'
        id: evaluate
        shell: bash
        run: |
          set +e
          node ChatMachines/GeminiSupervisor/scripts/live-ground-truth-reading-room.js verify '${{ steps.operation.outputs.challenge }}' '${{ github.sha }}'
          CODE=$?
          set -e

          if [ "$CODE" -eq 0 ]; then
            echo 'result=PASS' >> "$GITHUB_OUTPUT"
          elif [ "$CODE" -eq 2 ]; then
            echo 'result=FAILED' >> "$GITHUB_OUTPUT"
          else
            exit "$CODE"
          fi

      - name: Save replacement manifest after failure
        if: steps.operation.outputs.mode == 'verify' && steps.evaluate.outputs.result == 'FAILED'
        uses: actions/cache/save@v4
        with:
          path: .live-ground-truth-cache/${{ github.sha }}.json
          key: live-ground-truth-reading-room-${{ github.sha }}

      - name: Commit reading-room result
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ChatMachines/GeminiSupervisor/live-ground-truth/reading-room'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$ROOT"

          if git diff --cached --quiet; then
            echo 'No reading-room changes to commit.'
            exit 0
          fi

          if [ '${{ steps.operation.outputs.mode }}' = 'issue' ]; then
            git commit -m 'Issue PNG live ground truth reading challenge for ${{ github.sha }}'
          elif [ '${{ steps.evaluate.outputs.result }}' = 'PASS' ]; then
            git commit -m 'PASS PNG live ground truth reading challenge ${{ github.sha }}'
          else
            git commit -m 'FAILED PNG live ground truth reading challenge ${{ github.sha }} and issue fresh cards'
          fi

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done

          echo 'Unable to push reading-room result after rebasing.' >&2
          exit 1
