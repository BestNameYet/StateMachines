name: Publish AIChannel

on:
  push:
    branches: [main]
    paths:
      - 'untrusted AI/meta-procedure/AIChannel-bundle.zip'
      - '.github/workflows/publish-aichannel.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and validate AIChannel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile

          bundle = Path("untrusted AI/meta-procedure/AIChannel-bundle.zip")
          dest = Path("untrusted AI/meta-procedure/AIChannel")
          expected = {
              ".codex-plugin/plugin.json",
              ".mcp.json",
              "README.md",
              "aichannel/__init__.py",
              "aichannel/operations.py",
              "aichannel/runtime.py",
              "aichannel/store.py",
              "architecture-decision.json",
              "authoritative-inputs.json",
              "config/default.json",
              "external-best-practices.json",
              "gemini-input-config.json",
              "internal-api.json",
              "plugin-analysis-procedure.json",
              "plugin-python-sources.zip",
              "server.py",
              "skills/ai-channel/SKILL.md",
              "tests/test_aichannel.py",
              "verification.json",
          }

          if dest.exists():
              import shutil
              shutil.rmtree(dest)
          dest.mkdir(parents=True)

          root = dest.resolve()
          with zipfile.ZipFile(bundle) as z:
              files = {i.filename for i in z.infolist() if not i.is_dir()}
              if files != expected:
                  missing = sorted(expected - files)
                  extra = sorted(files - expected)
                  raise SystemExit(f"Bundle file set mismatch. missing={missing} extra={extra}")
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  target = (dest / info.filename).resolve()
                  if root not in target.parents:
                      raise SystemExit(f"Unsafe archive member: {info.filename}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))

          archive = dest / "plugin-python-sources.zip"
          with zipfile.ZipFile(archive) as z:
              members = [i for i in z.infolist() if not i.is_dir()]
              if len(members) != 75:
                  raise SystemExit(f"Expected 75 plugin Python sources, found {len(members)}")
              if any(not i.filename.endswith(".py") for i in members):
                  raise SystemExit("plugin-python-sources.zip contains a non-.py file")
              total = sum(i.file_size for i in members)
              if total != 496238:
                  raise SystemExit(f"Expected 496238 uncompressed source bytes, found {total}")
          print("Bundle and source archive validated")
          PY

      - name: Run AIChannel tests
        shell: bash
        working-directory: untrusted AI/meta-procedure/AIChannel
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v

      - name: MCP stdio smoke test
        shell: bash
        working-directory: untrusted AI/meta-procedure/AIChannel
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          import sys

          requests = [
              {"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"protocolVersion":"2026-07-28"}}},
              {"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"ai_channel","arguments":{"action":"invoke","behavior":"echo","input":{"message":"hello"}}}},
          ]
          payload = "".join(json.dumps(x) + "\n" for x in requests)
          cp = subprocess.run(
              [sys.executable, "server.py"],
              input=payload,
              text=True,
              capture_output=True,
              check=True,
          )
          lines = [json.loads(x) for x in cp.stdout.splitlines() if x.strip()]
          if len(lines) != 2:
              raise SystemExit(f"Expected 2 responses, got {len(lines)}: {cp.stdout!r}")
          tools = lines[0]["result"]["tools"]
          if [t["name"] for t in tools] != ["ai_channel"]:
              raise SystemExit(f"Unexpected tool list: {tools}")
          result = lines[1]["result"]["structuredContent"]
          if result.get("output", {}).get("message") != "hello":
              raise SystemExit(f"Unexpected echo result: {result}")
          print("MCP smoke PASS")
          PY

      - name: Remove staging artifacts and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f 'untrusted AI/meta-procedure/AIChannel-bundle.zip'
          rm -f '.github/workflows/publish-aichannel.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement configurable AIChannel MCP'
          git push origin HEAD:main
