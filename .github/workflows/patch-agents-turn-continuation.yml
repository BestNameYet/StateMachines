name: Patch Agents turn-continuation rules

on:
  push:
    branches: [main]
    paths:
      - .github/patch-agents-turn-continuation.trigger

permissions:
  contents: write

jobs:
  patch-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 1

      - name: Patch Agents.md
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('ChatMachines/GeminiSupervisor/Agents.md')
          text = path.read_text(encoding='utf-8')

          protocol_heading = '## ChatGPT Turn Continuation and Gemini Handshake Protocol'
          protocol = '''## ChatGPT Turn Continuation and Gemini Handshake Protocol

1. **The ChatGPT turn spans the Gemini handshake.** For every non-terminal procedure state, ChatGPT may not end the current user-facing turn merely because it has committed a `nextmessage`. Committing a `nextmessage` begins a wait obligation for the Gemini response to that committed message.
2. **Response required before ending.** After ChatGPT commits any `nextmessage`, ChatGPT must remain in the same turn until the corresponding Gemini supervisory response has been received and inspected.
3. **Next message required after a non-terminal response.** After receiving and inspecting a Gemini response, if the procedure remains active, ChatGPT must perform the required same-step correction or next-step execution and commit the resulting new `nextmessage` before the turn can progress toward completion.
4. **A commit is never a turn-ending boundary.** ChatGPT can never end its turn immediately after a new `nextmessage` is committed. That commit creates a new mandatory wait for the subsequent Gemini response.
5. **FAIL handling remains inside the same turn.** When Gemini returns `gate_result: "FAIL"`, ChatGPT must read the failure details, correct the same ChatGPT-owned execution step, commit the corrected `nextmessage` using the same run, and wait for the next Gemini response. Reporting the FAIL to the user does not satisfy this requirement and is not a valid turn-ending action.
6. **PASS handling remains inside the same turn while work remains.** When Gemini returns `gate_result: "PASS"` and another execution step remains, ChatGPT must execute that next ChatGPT-owned step, commit its `nextmessage`, and wait for the next Gemini response without ending the user-facing turn.
7. **Terminal condition.** ChatGPT may end the user-facing turn only after the latest committed `nextmessage` has received its Gemini response and that response establishes that the procedure has reached a terminal state with no further ChatGPT execution step or `nextmessage` required for that run.
8. **Violation.** Ending a turn while a Gemini response is outstanding, ending immediately after committing a `nextmessage`, or failing to commit and continue after a non-terminal Gemini response is a procedure failure.
'''

          if protocol_heading not in text:
              marker = '\n## Failure Examples\n'
              if marker not in text:
                  raise SystemExit('Failure Examples marker not found')
              text = text.replace(marker, '\n' + protocol + '\n## Failure Examples\n', 1)

          step_requirement = (
              '**Turn-continuation requirement for Step {n}.** ChatGPT must keep the current user-facing turn open through this step\'s complete commit-and-response handshake. '
              'After committing this step\'s `nextmessage`, ChatGPT must wait for and inspect the corresponding Gemini response and may not end the turn at the commit boundary. '
              'If that response is FAIL, ChatGPT must correct and recommit this same step and wait again. If that response is PASS and another step remains, ChatGPT must execute and commit the next step and wait again. '
              'The turn may end only after the latest committed `nextmessage` has received its Gemini response and the procedure is terminal with no further `nextmessage` required.'
          )

          for n in range(5):
              heading = f'## Step {n}'
              role_line = '**Required execution role: ChatGPT model. Forbidden execution role: Gemini model.**'
              req = step_requirement.format(n=n)
              if req in text:
                  continue
              pattern = re.escape(heading) + r'\n\n' + re.escape(role_line)
              replacement = heading + '\n\n' + role_line + '\n\n' + req
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not patch Step {n}; matches={count}')

          if text.count('**Turn-continuation requirement for Step ') != 5:
              raise SystemExit('Expected exactly five step-local turn-continuation requirements')
          if text.count(protocol_heading) != 1:
              raise SystemExit('Expected exactly one canonical turn-continuation protocol')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit Agents.md and self-clean patch files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-agents-turn-continuation.yml
          rm -f .github/patch-agents-turn-continuation.trigger
          git add ChatMachines/GeminiSupervisor/Agents.md .github/workflows/patch-agents-turn-continuation.yml .github/patch-agents-turn-continuation.trigger
          git commit -m "Require continuous Gemini handshake across all steps"
          git push origin HEAD:main
