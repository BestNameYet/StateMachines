name: Finalize generic evaluator config contract

on:
  push:
    paths:
      - '.github/workflows/finalize-generic-evaluator-config.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Move generic output contract into config and make Supervisor paths lazy
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const root = 'ChatMachines/GeminiEvaluation';
          const configPath = `${root}/config.json`;
          const sourcePath = `${root}/evaluate-supervisor.js`;

          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          config.evaluation_output_schema = {
            response_type: 'generic_evaluation',
            overall_result: 'PASS | FAIL | PARTIAL | INDETERMINATE',
            evaluation_heuristic: 'verbatim configured heuristic used',
            input_inventory: [
              { key: 'string', source: 'string', role_in_evaluation: 'string' }
            ],
            coverage_evaluation: {
              ground_truth_commit_count: 'integer | null',
              artifact_commit_count: 'integer | null',
              missing_commits: [{ sha: 'string', explanation: 'string' }],
              extra_commits: [{ sha: 'string', explanation: 'string' }],
              duplicate_commits: [{ sha: 'string', explanation: 'string' }],
              ordering_errors: [{ sha: 'string', explanation: 'string' }],
              result: 'PASS | FAIL | PARTIAL | INDETERMINATE',
              explanation: 'string'
            },
            contract_evaluation: [
              { requirement: 'string', result: 'PASS | FAIL | PARTIAL | INDETERMINATE', evidence: 'string', required_change: 'string | null' }
            ],
            semantic_evaluations: [
              {
                commit_number: 'integer | null',
                commit_sha: 'string',
                recorded_status: 'SUCCESS | FAILURE | other',
                evaluator_result: 'AGREE | DISAGREE | INDETERMINATE',
                corrected_status: 'SUCCESS | FAILURE | INDETERMINATE',
                rationale: 'string',
                evidence: 'string'
              }
            ],
            semantic_summary: {
              evaluations_expected: 'integer',
              evaluations_returned: 'integer',
              agreements: 'integer',
              disagreements: 'integer',
              indeterminate: 'integer'
            },
            required_corrections: [
              { scope: 'string', correction: 'string', reason: 'string' }
            ]
          };
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + '\n');

          let source = fs.readFileSync(sourcePath, 'utf8');

          const oldPaths = `const runtimeRoot = path.resolve(__dirname, config.runtime_root || '.');\nconst evaluationRoot = runtimeRoot;\nconst supervisorRoot = path.resolve(evaluationRoot, config.supervisor_root);\nconst agentsPath = path.join(supervisorRoot, config.agents_file);\nconst programPath = path.join(supervisorRoot, config.program_file);\nconst step3EvaluationPath = path.join(supervisorRoot, config.artifact_target_file);\nconst nextPath = path.join(evaluationRoot, config.new_message_folder, config.new_message_file);\nconst messagesPath = path.join(evaluationRoot, config.messages_file);\nconst evaluationOutputPath = path.join(evaluationRoot, config.evaluation_output_file);\nconst revisionDeliverablesOutputPath = path.join(evaluationRoot, config.revision_deliverables_output_path);\nconst revisionAgentsOutputPath = path.join(revisionDeliverablesOutputPath, config.revision_agents_output_file);\nconst revisionProgramOutputPath = path.join(revisionDeliverablesOutputPath, config.revision_program_output_file);\nconst sourceRevisionEnabled = config.source_revision_enabled === true;\nconst sourceRevisionConfigOutputPath = path.join(evaluationRoot, config.source_revision_config_output_path);\nconst artifactRevisionEnabled = config.artifact_revision_enabled === true;\nconst artifactRevisionOutputPath = path.join(evaluationRoot, config.artifact_revision_output_path);`;

          const newPaths = `const runtimeRoot = path.resolve(__dirname, config.runtime_root || '.');\nconst evaluationRoot = runtimeRoot;\nconst isGenericMode = config.evaluation_mode === 'generic';\n\nfunction optionalPath(base, configuredPath) {\n  return typeof configuredPath === 'string' && configuredPath.trim() ? path.resolve(base, configuredPath) : null;\n}\n\nconst supervisorRoot = !isGenericMode ? optionalPath(evaluationRoot, config.supervisor_root) : null;\nconst agentsPath = !isGenericMode && supervisorRoot ? optionalPath(supervisorRoot, config.agents_file) : null;\nconst programPath = !isGenericMode && supervisorRoot ? optionalPath(supervisorRoot, config.program_file) : null;\nconst step3EvaluationPath = !isGenericMode && supervisorRoot ? optionalPath(supervisorRoot, config.artifact_target_file) : null;\nconst nextPath = path.join(evaluationRoot, config.new_message_folder, config.new_message_file);\nconst messagesPath = path.join(evaluationRoot, config.messages_file);\nconst evaluationOutputPath = path.join(evaluationRoot, config.evaluation_output_file);\nconst revisionDeliverablesOutputPath = optionalPath(evaluationRoot, config.revision_deliverables_output_path);\nconst revisionAgentsOutputPath = revisionDeliverablesOutputPath ? optionalPath(revisionDeliverablesOutputPath, config.revision_agents_output_file) : null;\nconst revisionProgramOutputPath = revisionDeliverablesOutputPath ? optionalPath(revisionDeliverablesOutputPath, config.revision_program_output_file) : null;\nconst sourceRevisionEnabled = !isGenericMode && config.source_revision_enabled === true;\nconst sourceRevisionConfigOutputPath = !isGenericMode ? optionalPath(evaluationRoot, config.source_revision_config_output_path) : null;\nconst artifactRevisionEnabled = !isGenericMode && config.artifact_revision_enabled === true;\nconst artifactRevisionOutputPath = !isGenericMode ? optionalPath(evaluationRoot, config.artifact_revision_output_path) : null;`;

          if (!source.includes(oldPaths)) throw new Error('Expected path initialization block not found.');
          source = source.replace(oldPaths, newPaths);

          const schemaStart = source.indexOf("  const schema = {\n    response_type: 'generic_evaluation',", source.indexOf('function buildGenericEvaluationInstruction'));
          const sectionsStart = source.indexOf('  const sections = [', schemaStart);
          if (schemaStart < 0 || sectionsStart < 0) throw new Error('Generic hardcoded schema block not found.');
          source = source.slice(0, schemaStart) + `  if (!config.evaluation_output_schema || Array.isArray(config.evaluation_output_schema) || typeof config.evaluation_output_schema !== 'object') {\n    throw new Error('Generic evaluation requires config.evaluation_output_schema object.');\n  }\n\n` + source.slice(sectionsStart);
          source = source.replace('    JSON.stringify(schema, null, 2),', '    JSON.stringify(config.evaluation_output_schema, null, 2),');

          source = source.replace("  const useGenericEvaluation = config.evaluation_mode === 'generic';", '  const useGenericEvaluation = isGenericMode;');

          const callLine = '  const result = await callGemini(messages, systemInstruction);';
          const validation = `  const result = await callGemini(messages, systemInstruction);\n\n  if (useGenericEvaluation) {\n    const expectedResponseType = config.evaluation_output_schema?.response_type;\n    if (typeof expectedResponseType === 'string' && expectedResponseType && result.payload.response_type !== expectedResponseType) {\n      throw new Error(\`Generic evaluator returned response_type \${result.payload.response_type ?? 'missing'}; expected \${expectedResponseType}.\`);\n    }\n  }`;
          if (!source.includes(callLine)) throw new Error('Gemini call line not found.');
          source = source.replace(callLine, validation);

          source = source.replace("  if (result.payload.response_type === 'paired_revision') {", "  if (!useGenericEvaluation && result.payload.response_type === 'paired_revision') {");
          source = source.replace("  if (result.payload.response_type === 'artifact_revision') {", "  if (!useGenericEvaluation && result.payload.response_type === 'artifact_revision') {");

          source = source.replace('    evaluated_program: programPath,\n    specification: agentsPath,', "    evaluated_program: useGenericEvaluation ? null : programPath,\n    specification: useGenericEvaluation ? null : agentsPath,");

          fs.writeFileSync(sourcePath, source);
          NODE

      - name: Commit corrected config-driven evaluator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChatMachines/GeminiEvaluation/config.json ChatMachines/GeminiEvaluation/evaluate-supervisor.js
          git commit -m "Make generic evaluator fully config-driven"
          git push origin HEAD:main
