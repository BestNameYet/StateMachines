name: README truth-verification documentation update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/readme-truth-verification-doc.yml

permissions:
  contents: write

jobs:
  document-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Append deployed nonce repair verification section
        run: node ChatMachines/GeminiSupervisor/scripts/append-readme-truth-verification.js

      - name: Commit README locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChatMachines/GeminiSupervisor/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Document GeminiSupervisor truth-reader verification'
          fi

      - name: Refresh stable reader provenance against new README commit
        run: node ChatMachines/GeminiSupervisor/scripts/sync-stable-readers.js

      - name: Remove one-time staging files and commit synchronized reader
        shell: bash
        run: |
          set -euo pipefail
          rm -f ChatMachines/GeminiSupervisor/scripts/append-readme-truth-verification.js
          rm -f .github/workflows/readme-truth-verification-doc.yml

          git add ChatMachines/GeminiSupervisor/dependency-map.json
          git add ChatMachines/GeminiSupervisor/stable-readers/README.reader.json
          git add -A ChatMachines/GeminiSupervisor/scripts/append-readme-truth-verification.js
          git add -A .github/workflows/readme-truth-verification-doc.yml

          if ! git diff --cached --quiet; then
            git commit -m 'Sync README truth-reader provenance'
          fi

          git push origin HEAD:main
