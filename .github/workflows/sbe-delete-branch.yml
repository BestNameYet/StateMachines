name: SBE Delete Processing Branch

on:
  workflow_run:
    workflows: ['SBE Seal and Evaluate']
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  delete-processing-branch:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve originating pull request
        id: pr
        env:
          EVENT_PATH: ${{ github.event_path }}
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$EVENT_PATH")
          HEAD_REF=$(jq -r '.workflow_run.pull_requests[0].head.ref // empty' "$EVENT_PATH")
          if [ -z "$PR_NUMBER" ] || [ -z "$HEAD_REF" ]; then
            echo 'Successful SBE run has no associated pull request.' >&2
            exit 1
          fi
          [[ "$HEAD_REF" =~ ^processing/[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Verify delete marker and sealed result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail

          MARKER="$RUNNER_TEMP/sbe-delete-marker.json"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/contents/.delete-processing-branch" \
            -f "ref=${HEAD_REF}" --jq '.content' | tr -d '\n' | base64 --decode > "$MARKER"

          mapfile -t VALUES < <(node - "$MARKER" <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (m.sbe_version !== 1 || m.delete_branch !== true) throw new Error('Invalid SBE delete marker.');
          for (const key of ['request_id','evaluated_head_sha','source_file','sealed_path']) {
            if (typeof m[key] !== 'string' || !m[key]) throw new Error(`Marker missing ${key}.`);
          }
          if (!Number.isInteger(m.pr_number)) throw new Error('Marker missing pr_number.');
          console.log(m.request_id);
          console.log(m.pr_number);
          console.log(m.evaluated_head_sha);
          console.log(m.source_file);
          console.log(m.sealed_path);
          NODE
          )

          REQUEST_ID="${VALUES[0]}"
          MARKER_PR="${VALUES[1]}"
          EVALUATED_SHA="${VALUES[2]}"
          SOURCE_FILE="${VALUES[3]}"
          SEALED_PATH="${VALUES[4]}"

          [ "$MARKER_PR" = "$PR_NUMBER" ]
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ "$EVALUATED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$SOURCE_FILE" =~ ^[A-Za-z0-9._/-]+\.gz$ ]]
          [[ "$SOURCE_FILE" != *'..'* ]]
          [ "$SEALED_PATH" = "SBE/sealed/${REQUEST_ID}/${EVALUATED_SHA}" ]

          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_REF}" --jq '.object.sha')
          PARENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CURRENT_SHA}" --jq '.parents[0].sha')
          [ "$PARENT_SHA" = "$EVALUATED_SHA" ] || {
            echo 'Processing branch changed after the evaluated submission; refusing deletion.' >&2
            exit 1
          }

          mapfile -t CHANGES < <(gh api "repos/${GITHUB_REPOSITORY}/commits/${CURRENT_SHA}" --jq '.files[] | [.status,.filename] | @tsv')
          [ "${#CHANGES[@]}" -eq 2 ]
          printf '%s\n' "${CHANGES[@]}" | grep -Fx $'added\t.delete-processing-branch' >/dev/null
          printf '%s\n' "${CHANGES[@]}" | grep -Fx $'removed\t'"${SOURCE_FILE}" >/dev/null

          gh api --method GET "repos/${GITHUB_REPOSITORY}/contents/${SEALED_PATH}/submission.7z" -f ref=main >/dev/null

          MANIFEST="$RUNNER_TEMP/sbe-manifest.json"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/contents/${SEALED_PATH}/manifest.json" \
            -f ref=main --jq '.content' | tr -d '\n' | base64 --decode > "$MANIFEST"
          REQUEST_ID="$REQUEST_ID" PR_NUMBER="$PR_NUMBER" EVALUATED_SHA="$EVALUATED_SHA" SOURCE_FILE="$SOURCE_FILE" node - "$MANIFEST" <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (m.sbe_version !== 1) throw new Error('Manifest version mismatch.');
          if (m.request_id !== process.env.REQUEST_ID) throw new Error('Manifest request mismatch.');
          if (String(m.pr_number) !== process.env.PR_NUMBER) throw new Error('Manifest PR mismatch.');
          if (m.source_head_sha !== process.env.EVALUATED_SHA) throw new Error('Manifest SHA mismatch.');
          if (m.source_file !== process.env.SOURCE_FILE) throw new Error('Manifest source-file mismatch.');
          if (m.evaluation_result !== 'PASS') throw new Error('SBE completion evaluation is not PASS.');
          NODE

      - name: Close pull request and delete branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -f state=closed >/dev/null
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_REF}"
