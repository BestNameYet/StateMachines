name: Count non-UUID conversation keys
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/count-non-uuid-keys.yml
      - 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/key-extraction/count-non-uuid-keys.mjs'
permissions:
  contents: write
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test nested key counting
        run: node 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/key-extraction/count-non-uuid-keys.mjs' --test
      - name: Count all non-UUID keys
        run: node 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/key-extraction/count-non-uuid-keys.mjs'
      - uses: actions/upload-artifact@v4
        with:
          name: non-uuid-key-counts
          path: 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/key-extraction/outputs/non_uuid_key_counts*'
          retention-days: 30
      - name: Commit counts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/key-extraction/outputs/non_uuid_key_counts.json' 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/key-extraction/outputs/non_uuid_key_counts.csv' 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/key-extraction/outputs/non_uuid_key_counts_summary.json'
          git commit -m 'Save non-UUID key occurrence counts for complete dataset'
          git push origin HEAD:main
