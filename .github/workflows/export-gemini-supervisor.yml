name: Export GeminiSupervisor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-gemini-supervisor.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build byte-preserving export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .migration
          XZ_OPT=-9e tar -C ChatMachines/GeminiSupervisor -cJf /tmp/gemini-supervisor.tar.xz .
          base64 -w 0 /tmp/gemini-supervisor.tar.xz > .migration/gemini-supervisor.tar.xz.b64
          rm -f .migration/gemini-supervisor.tar.gz.b64

      - name: Commit export
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .migration
          git commit -m "Replace temporary GeminiSupervisor migration export with xz"
          git push
