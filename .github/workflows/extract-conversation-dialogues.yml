name: Extract branch dialogues
on:
  workflow_dispatch:
    inputs:
      batch_path:
        description: Repository-relative path to a batch JSON file
        required: true
        type: string
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test dialogue extraction
        run: node 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/bertopic/extract-dialogues.mjs' --test
      - name: Extract every branch as a separate dialogue
        env:
          BATCH_PATH: ${{ inputs.batch_path }}
        run: |
          node 'ChatMachines/Workflow Interactive Procedures/Conversation Archive Analysis/bertopic/extract-dialogues.mjs' \
            --input "$BATCH_PATH" \
            --output "$RUNNER_TEMP/conversation-dialogues"
      - uses: actions/upload-artifact@v4
        with:
          name: conversation-dialogues
          path: ${{ runner.temp }}/conversation-dialogues/*.txt
          if-no-files-found: error
          retention-days: 30
