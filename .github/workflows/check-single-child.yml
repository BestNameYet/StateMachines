name: Check flattened projection single-child invariant

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-single-child.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run single-child checker
        id: check
        shell: bash
        run: |
          set +e
          node ChatMachines/TokenizerCalibration/check-single-child.js \
            ChatMachines/TokenizerCalibration/agents-by-header-flattened.json \
            > ChatMachines/TokenizerCalibration/check-single-child-result.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat ChatMachines/TokenizerCalibration/check-single-child-result.json
          exit 0

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChatMachines/TokenizerCalibration/check-single-child-result.json
          if ! git diff --cached --quiet; then
            git commit -m "Record flattened projection single-child check"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Preserve checker exit status
        if: steps.check.outputs.status != '0'
        run: exit "${{ steps.check.outputs.status }}"
