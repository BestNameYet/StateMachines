name: Populate TEMP2 Python files

on:
  push:
    branches: [main]
    paths:
      - 'untrusted AI/meta-procedure/TEMP2-transfer.zip'
      - '.github/workflows/populate-temp2-python.yml'

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Python files into TEMP2
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='untrusted AI/meta-procedure/TEMP2-transfer.zip'
          DEST='untrusted AI/meta-procedure/TEMP2'
          rm -rf "$DEST"
          mkdir -p "$DEST"
          python - <<'PY'
          from pathlib import Path
          import zipfile

          payload = Path("untrusted AI/meta-procedure/TEMP2-transfer.zip")
          dest = Path("untrusted AI/meta-procedure/TEMP2").resolve()

          with zipfile.ZipFile(payload) as z:
              members = z.infolist()
              if len(members) != 152:
                  raise SystemExit(f"Expected 152 files, found {len(members)}")
              for info in members:
                  name = info.filename
                  if info.is_dir():
                      continue
                  suffix = Path(name).suffix.lower()
                  if suffix not in {".py", ".pyc"}:
                      raise SystemExit(f"Unexpected file type: {name}")
                  target = (dest / name).resolve()
                  if dest not in target.parents:
                      raise SystemExit(f"Unsafe path: {name}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))

          actual = sorted(
              p for p in dest.rglob("*")
              if p.is_file() and p.suffix.lower() in {".py", ".pyc"}
          )
          if len(actual) != 152:
              raise SystemExit(f"Expected 152 extracted files, found {len(actual)}")
          print(f"Extracted {len(actual)} files")
          PY

      - name: Remove transfer artifacts and commit result
        shell: bash
        run: |
          set -euo pipefail
          rm -f 'untrusted AI/meta-procedure/TEMP2-transfer.zip'
          rm -f '.github/workflows/populate-temp2-python.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Populate TEMP2 with Python files'
          git push origin HEAD:main
