          model=os.environ.get("GEMINI_MODEL") or "gemini-3.8-flash"
          def count(text):
              payload=json.dumps({"contents":[{"role":"user","parts":[{"text":text}]}]}).encode()
              for attempt in range(6):
                  req=urllib.request.Request("https://generativelanguage.googleapis.com/v1beta/models/"+model+":countTokens",data=payload,headers={"Content-Type":"application/json","x-goog-api-key":os.environ["GEMINI_API_KEY"]})
                  try:
                      with urllib.request.urlopen(req,timeout=180) as response: return json.load(response)["totalTokens"]
                  except urllib.error.HTTPError as e:
                      if e.code not in (429,500,502,503,504) or attempt==5: raise RuntimeError("countTokens HTTP "+str(e.code)) from None
                      time.sleep(15*(attempt+1))
          manifest=json.loads((root/"bins-manifest.json").read_text())
          originals=[]
          units=[]
          def split(data,record,relative,part=""):
              text=json.dumps(data,ensure_ascii=False,indent=2)+"\n"
              tokens=count(text)
              if tokens>=500000:
                  if len(data)<2: raise RuntimeError("Single conversation exceeds limit: "+str(relative))
                  mid=len(data)//2
                  split(data[:mid],record,relative,part+"a")
                  right=dict(record)
                  right["conversation_start_1based"]=record["conversation_start_1based"]+mid
                  split(data[mid:],right,relative,part+"b")
                  return
              relative=relative.with_name(relative.stem+"-part-"+part+relative.suffix)
              rec=dict(record)
              rec.update(conversation_count=len(data),conversation_end_1based=record["conversation_start_1based"]+len(data)-1,first_conversation_id=data[0].get("conversation_id"),last_conversation_id=data[-1].get("conversation_id"),bytes=len(text.encode()),sha256=hashlib.sha256(text.encode()).hexdigest())
              units.append({"old":str(relative),"text":text,"tokens":tokens,"record":rec})
          for rec in manifest["bins"]:
              relative=pathlib.Path(rec["output"])
              path=root/relative
              raw=path.read_bytes()
              info=counts[path.name]
              if hashlib.sha256(raw).hexdigest()!=info["sha256"]: raise RuntimeError("Source changed: "+str(path))
              originals.append(path)
              if info["tokens"]>=500000:
                  split(json.loads(raw),rec,relative)
              else:
                  units.append({"old":str(relative),"text":raw.decode(),"tokens":info["tokens"],"record":rec})
          groups=[]
          for batch in sorted({u["old"].split("/")[0] for u in units}):
              current=[]; total=0
              for u in [u for u in units if u["old"].startswith(batch+"/")]:
                  if current and total+u["tokens"]>=500000:
                      groups.append({"batch":batch,"units":current,"tokens":total})
                      current=[]; total=0
                  current.append(u);total+=u["tokens"]
              if current:groups.append({"batch":batch,"units":current,"tokens":total})
          assert sum(u["record"]["conversation_count"] for u in units)==manifest["conversation_count"]
          assert len({u["record"]["output"] for u in units if "-part-" not in u["old"]})==len([u for u in units if "-part-" not in u["old"]])
          outbins=[]; report=[]; perbatch={}
          for group in groups:
              batch=group["batch"]; idx=perbatch.get(batch,0);perbatch[batch]=idx+1
              folder=pathlib.Path(batch)/("subdivision-%02d"%idx)
              for u in group["units"]:
                  new=folder/pathlib.Path(u["old"]).relative_to(batch)
                  dest=root/new;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_text(u["text"])
                  rec=dict(u["record"]);rec["output"]=str(new);rec["tokens"]=u["tokens"];outbins.append(rec)
              row={"path":str(root/folder),"file_count":len(group["units"]),"file_token_sum":group["tokens"]}
              assert row["file_token_sum"]<500000
              report.append(row);print(json.dumps(row),flush=True)
          for path in originals:path.unlink()
          manifest.update(bins=outbins,bin_count=len(outbins),subdivision_count=len(groups))
          (root/"bins-manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n")
          result={"method":"Greedy next-fit in original file order within each batch; split oversized bins at conversation boundaries","strict_token_limit":500000,"token_basis":"Sum of exact Gemini countTokens file counts; excludes processor prompt wrappers","model":model,"source_commit":os.environ["GITHUB_SHA"],"conversation_count":sum(r["conversation_count"] for r in outbins),"file_count":len(outbins),"subdivisions":report}
          (root/"subdivisions-manifest.json").write_text(json.dumps(result,indent=2)+"\n")
          print("SUMMARY",json.dumps({k:v for k,v in result.items() if k!="subdivisions"}),flush=True)
          subprocess.run(["git","config","user.name","github-actions[bot]"],check=True)
          subprocess.run(["git","config","user.email","41898282+github-actions[bot]@users.noreply.github.com"],check=True)
          subprocess.run(["git","add",str(root)],check=True)
          subprocess.run(["git","commit","-m","Greedily subdivide conversation batches below 500000 file tokens"],check=True)
          subprocess.run(["git","push","origin","HEAD:main"],check=True)
          
