name: Gemini Supervisor state machine

on:
  push:
    branches: [main]
    paths:
      - ChatMachines/GeminiSupervisor/nextmessage/nextmessage.json

permissions:
  contents: write

concurrency:
  group: gemini-supervisor-state-machine
  cancel-in-progress: false

jobs:
  run-supervisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Gemini Supervisor on GitHub Node
        env:
          GEMINI_API_KEY: ${{ vars.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node ChatMachines/GeminiSupervisor/send-to-gemini.js

      - name: Commit returned run state, context, and store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChatMachines/GeminiSupervisor/runs
          if git diff --cached --quiet; then
            echo "No run state/context/store change."
            exit 0
          fi
          git commit -m "Advance Gemini Supervisor run"
          git push origin HEAD:main
