name: Gemini Supervisor state machine

on:
  push:
    branches: [main]
    paths:
      - ChatMachines/GeminiSupervisor/nextmessage/nextmessage.json

permissions:
  contents: write

concurrency:
  group: gemini-supervisor-state-machine
  cancel-in-progress: false

jobs:
  run-supervisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and send one state-machine substep
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          APPS_SCRIPT_WEB_APP_URL: ${{ secrets.APPS_SCRIPT_WEB_APP_URL }}
        run: node ChatMachines/GeminiSupervisor/send-to-gemini.js

      - name: Commit returned state and context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ChatMachines/GeminiSupervisor/current_state.json \
            ChatMachines/GeminiSupervisor/messages.json
          if git diff --cached --quiet; then
            echo "No state/context change."
            exit 0
          fi
          git commit -m "Advance Gemini Supervisor state machine"
          git push origin HEAD:main
