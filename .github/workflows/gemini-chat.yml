name: Gemini Supervisor state machine

on:
  push:
    branches: [main]
    paths:
      - ChatMachines/GeminiSupervisor/nextmessage/nextmessage.json

permissions:
  contents: write

concurrency:
  group: gemini-supervisor-state-machine
  cancel-in-progress: false

jobs:
  run-supervisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Gemini Supervisor on GitHub Node
        env:
          GEMINI_API_KEY: ${{ vars.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node ChatMachines/GeminiSupervisor/send-to-gemini.js

      - name: Commit returned run state, context, and store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChatMachines/GeminiSupervisor/runs
          if git diff --cached --quiet; then
            echo "No run state/context/store change."
            exit 0
          fi
          META=$(node - <<'NODE'
          const fs = require('node:fs');
          const root = 'ChatMachines/GeminiSupervisor';
          const trigger = JSON.parse(fs.readFileSync(`${root}/nextmessage/nextmessage.json`, 'utf8'));
          const run = trigger.run_nonce;
          const step = trigger.execution?.step;
          const state = JSON.parse(fs.readFileSync(`${root}/runs/${run}/state.json`, 'utf8')).current_state;
          const rec = state.procedure?.step_records?.[String(step)];
          const gate = rec?.transition_value || rec?.supervisory_return?.supervisory_gate?.gate_result || 'UNKNOWN';
          process.stdout.write(`${run} Step ${step} ${gate}`);
          NODE
          )
          git commit -m "Gemini Supervisor checkpoint: ${META}"
          git push origin HEAD:main
