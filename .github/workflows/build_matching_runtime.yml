name: Build Persistent Matching Runtime

on:
  push:
    paths:
      - 'matching/Dockerfile.runtime'
      - '.github/workflows/build_matching_runtime.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout models and dependency wheels
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Resolve LFS binaries
        run: |
          git lfs pull --include='matching/models/*,matching/wheels/*'
          test "$(find matching/wheels -name '*.whl' | wc -l)" -ge 10
          test "$(stat -c %s matching/models/feature_encoder.onnx)" -gt 1000000
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish verified image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: matching/Dockerfile.runtime
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/statemachines-matching-runtime:py310
          provenance: false
