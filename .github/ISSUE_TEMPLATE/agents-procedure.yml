name: AGENTS Procedure
description: Start a separate interactive procedure run
body:
  - type: dropdown
    id: procedure
    attributes:
      label: Procedure
      options:
        - AGENTS Procedure
      default: 0
    validations:
      required: true
  - type: textarea
    id: user-request
    attributes:
      label: User request
      description: Enter the original request for this procedure run.
    validations:
      required: true
